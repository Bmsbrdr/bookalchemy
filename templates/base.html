<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Library{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #24332b; background: #faf9f5; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
    a { color: #286347; }
    label { display: block; margin-top: 1rem; }
    input, select, button { font: inherit; padding: .6rem; max-width: 100%; box-sizing: border-box; }
    input, select { display: block; width: 100%; max-width: 28rem; }
    button { margin-top: 1rem; cursor: pointer; }
    .message { padding: 1rem; background: #e2f2df; }
    .error { padding: 1rem; background: #ffe4df; }
    .books { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 2rem; }
    article { padding: 1rem; border: 1px solid #d5ddd3; border-radius: .5rem; background: white; }
    .cover { height: 200px; display: grid; place-items: center; background: #eef0e8; }
    .cover img { max-width: 100%; max-height: 200px; }
    .cover span { padding: 1rem; }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="{{ url_for('home') }}">Library</a>
    <a href="{{ url_for('add_author') }}">Add Author</a>
    <a href="{{ url_for('add_book') }}">Add Book</a>
  </nav>
  {% for message in get_flashed_messages() %}<p class="message" role="status">{{ message }}</p>{% endfor %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
